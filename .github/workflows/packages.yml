# .github/workflows/packages.yml
# ──────────────────────────────────────────────────────────────────────────────
# Does every name in install/packages.txt still exist in the Arch repos?
#
# WHY THIS IS NOT COVERED ALREADY: bootstrap.yml runs the reusable bootstrap test
# with `--links-only`, which deliberately skips provision() — so the package list,
# the single most volatile file in this repo, has never been checked by a blocking
# gate. Arch is a ROLLING release: packages get renamed (`doggo` moved AUR→extra)
# and dropped between runs, and bootstrap.sh's per-package fallback used to swallow
# those failures silently. It now reports them, but only once you run it on a real
# box. This catches it at PR time instead.
#
# The scheduled run matters as much as the PR run: a rename upstream breaks a file
# nobody edited, so there is no PR to attach the failure to.
#
# Resolution only — `pacman -Si` reads the sync DB and downloads no packages, so
# this is a fast job, not a full provision.
#
# It runs `make test`, which runs the whole test/ suite (today: test/check-packages.sh).
# That is deliberate and load-bearing: dotgibson/dotfiles-core#691 requires every repo to
# carry a test/ directory that a workflow actually executes, and this is that workflow.
#
# TODO(upstream): this is repo-local because dotfiles-core has no reusable for it
# yet. Every OS repo has the same gap, so the durable home is a `packages_check`
# input on dotfiles-core's bootstrap-test.yml — at which point this file collapses
# to a 3-line caller like every other workflow here.
# ──────────────────────────────────────────────────────────────────────────────
name: packages

on:
  pull_request:
    paths: ['install/packages.txt', 'test/**', 'Makefile', '.github/workflows/packages.yml']
  push:
    branches: [main]
    paths: ['install/packages.txt', 'test/**', 'Makefile', '.github/workflows/packages.yml']
  schedule:
    # Sun 07:00 UTC — a free fleet slot (web Sat 08:00, arch claude-routines Sat
    # 10:00, core Tue, Defense Wed, htpx Thu, Offense Fri).
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: test suite — resolve package names (no install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest@sha256:b944cc65c5f28665dfd5fdbf5ed2997c88f5bb4a0aefac7ee8a7ef01893e5ed9
    steps:
      - name: Install job deps
        # Full -Syu, never a bare -Sy: the repo's own golden rule, and a partial
        # upgrade against a stale base image is exactly what it protects against.
        # Retried — Arch mirrors intermittently time out in CI, and a mirror blip
        # should not red a PR that changed nothing.
        run: |
          n=0
          until pacman -Syu --noconfirm --needed make git; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then echo "::error::pacman prep failed after $n attempts"; exit 1; fi
            echo "prep attempt $n failed (mirror timeout?), retrying in $((n*10))s..." >&2
            sleep $((n*10))
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mark the checkout safe for git
        # The container runs as root while the checkout is owned by the runner
        # user, which trips git's dubious-ownership guard.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run the test suite
        # `make test`, not `make packages-check`: this is the workflow that satisfies the
        # fleet test floor (dotgibson/dotfiles-core#691), so it must run the SUITE rather
        # than one target inside it — otherwise a second test/ script would be added and
        # never executed by anything. test/check-packages.sh is the whole suite today, and
        # `make packages-check` still runs exactly it for anyone who types that verb.
        #
        # It reuses core/lib/bootstrap-lib.sh's blib_read_pkgs_into — the SAME parser
        # bootstrap.sh uses — so CI cannot pass on a list bootstrap would read differently.
        #
        # If a future test needs heavier deps than `make git` above, give it its own lane
        # rather than growing this container: the point of this job is that resolution is
        # cheap.
        run: make test
